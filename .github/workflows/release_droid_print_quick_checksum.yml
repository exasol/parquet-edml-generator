name: Release Droid - Print Quick Checksum
on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK
        # We need a JDK additionally to GraalVM to configure Maven toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          # Disable caching to avoid cache poisoning of release build
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        # This will define GRAALVM_HOME used by native-maven-plugin
        with:
          java-version: "25"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Maven skipping tests
        run: mvn --batch-mode clean verify -DskipTests -DossindexSkip=true
      - name: Print checksum
        run: echo 'checksum_start==';find target -maxdepth 1 -name *.jar -exec sha256sum "{}" + | xargs;echo '==checksum_end'
